spring.application.name=Gym CRM system
spring.profiles.default=local

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [tx:%X{transactionId:-}] %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,metrics,prometheus

security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.brute-force.max-attempts=${SECURITY_BRUTE_FORCE_MAX_ATTEMPTS:3}
security.brute-force.lockout-duration-seconds=${SECURITY_BRUTE_FORCE_LOCKOUT_DURATION_SECONDS:300}
security.brute-force.cleanup-interval-millis=${SECURITY_BRUTE_FORCE_CLEANUP_INTERVAL_MILLIS:60000}
