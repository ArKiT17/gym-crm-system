spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gym_crm?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoint.health.show-details=always

security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
security.jwt.secret=${JWT_SECRET:local-development-secret-1234567890}
